# ============================================================
# Nginx — site + API própria na mesma VPS.
# Copie para /etc/nginx/sites-available/mro e ative com:
#   ln -s /etc/nginx/sites-available/mro /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# O certbot ajusta os blocos de TLS automaticamente.
# ============================================================

# ---------- Site (React) ----------
server {
    listen 80;
    listen [::]:80;
    server_name maisresultadosonline.com.br www.maisresultadosonline.com.br;

    root /var/www/mro/dist;
    index index.html;

    client_max_body_size 300M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA: qualquer rota desconhecida entrega o index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache, senão o deploy não aparece para quem já visitou.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets com hash podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

# ---------- API própria (REST, Auth, Storage, Funções, Realtime) ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.maisresultadosonline.com.br;

    client_max_body_size 300M;
    client_body_timeout 600s;

    # CORS é controlado exclusivamente pelo backend Express. Não adicione
    # Access-Control-* aqui: dois valores no Allow-Origin quebram o navegador.
    # OPTIONS também segue ao backend para receber a origem autorizada correta.

    # MRO-TOOL-CORS-BEGIN
    # Exceção deliberada: esta API é pública para extensões externas e não usa
    # cookies. O Nginx responde o preflight mesmo durante reinícios do runtime e
    # mantém CORS em erros 4xx/5xx; os headers do upstream são ocultados para
    # nunca gerar valores duplicados.
    # Cobre a URL exata e também versões da extensão que acrescentem barra final.
    location ^~ /functions/v1/mro-tool-api {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            # Libera os headers realmente solicitados por qualquer versão da extensão.
            add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Access-Control-Allow-Private-Network "true" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
            add_header Cache-Control "no-store" always;
            add_header Vary "Origin, Access-Control-Request-Headers" always;
            add_header X-Cors-Owner "nginx-mro-tool" always;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type, X-MRO-Request-Id, X-MRO-Handler" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header Access-Control-Allow-Private-Network "true" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "no-store" always;
        add_header Vary "Origin, Access-Control-Request-Headers" always;
        add_header X-Cors-Owner "nginx-mro-tool" always;

        access_log /var/log/nginx/mro-tool-access.log combined;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
    # MRO-TOOL-CORS-END

    # Mídias passam pelo backend para preservar Range/206 e recuperar do
    # fallback qualquer arquivo que não tenha vindo na migração.
    location /storage/v1/object/public/ {
        # Impede herdar add_header CORS de blocos http/server antigos. O header
        # Access-Control-Allow-Origin correto passa diretamente do backend.
        add_header X-Cors-Owner "backend" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    # WebSocket do realtime.
    location /realtime/v1 {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        # Impede herança de regras CORS globais sem duplicar o header do backend.
        add_header X-Cors-Owner "backend" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }
}
