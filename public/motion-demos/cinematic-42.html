<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRO Inteligente - Cinematic Motion 4.2 Stories</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#000;
    color:white;
    overflow:hidden;
    font-family:Montserrat,sans-serif;
}

.stage{
    position:relative;
    /* Palco 9:16 real para Instagram Stories, sempre inteiro na viewport */
    width:min(100vw, 56.25vh);
    height:min(100vh, 177.7778vw);
    aspect-ratio:9 / 16;
    max-width:100vw;
    max-height:100vh;
    overflow:hidden;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    isolation:isolate;
    background:
    radial-gradient(ellipse at 50% 48%,#092447 0%,#020812 55%,#000 100%);
}

.background-grid{
    position:absolute;
    inset:-50%;
    background-image:
    linear-gradient(rgba(0,140,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,140,255,.08) 1px,transparent 1px);
    background-size:65px 65px;
    transform:perspective(600px) rotateX(55deg);
    animation:gridMove 20s linear infinite;
    z-index:-4;
}

@keyframes gridMove{
    to{transform:perspective(600px) rotateX(55deg) translateY(200px)}
}

.glow{
    position:absolute;
    width:60vw;
    height:60vw;
    border-radius:50%;
    background:#006dff;
    filter:blur(150px);
    opacity:.17;
    z-index:-3;
    animation:glowMove 9s ease-in-out infinite alternate;
}

@keyframes glowMove{
    to{transform:scale(1.5);opacity:.3}
}

.glow2{
    position:absolute;
    width:35vw;
    height:35vw;
    right:-15%;
    top:-15%;
    background:#00baff;
    filter:blur(130px);
    opacity:.13;
    z-index:-3;
}

#particles{
    position:absolute;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-2;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#54c9ff;
    box-shadow:0 0 12px #008cff;
    animation:particleFloat var(--duration) linear infinite;
}

@keyframes particleFloat{
    from{transform:translateY(100px);opacity:0}
    20%{opacity:1}
    to{transform:translate(var(--move),-110vh);opacity:0}
}

.energy-ring{
    position:absolute;
    width:300px;
    height:300px;
    border:1px solid rgba(0,160,255,.3);
    border-radius:50%;
    box-shadow:0 0 40px rgba(0,130,255,.15);
    z-index:-1;
    animation:ringRotate 18s linear infinite;
}

.energy-ring:before{
    content:"";
    position:absolute;
    inset:30px;
    border:1px dashed rgba(0,170,255,.4);
    border-radius:50%;
}

@keyframes ringRotate{
    to{transform:rotate(360deg) scale(1.2)}
}

/* FLASH */

.flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:40;
}

.flash.hit{animation:flashEffect .4s ease-out}

@keyframes flashEffect{
    0%{opacity:0}
    15%{opacity:.55}
    100%{opacity:0}
}

/* INTERFACE */

.progress{
    position:absolute;
    top:0;
    left:0;
    height:3px;
    width:0;
    background:linear-gradient(90deg,#006dff,#00e5ff);
    box-shadow:0 0 15px #00aaff;
    z-index:50;
}

.counter{
    position:absolute;
    top:4%;
    right:6%;
    color:rgba(255,255,255,.55);
    font-size:10px;
    letter-spacing:3px;
    font-weight:800;
    z-index:50;
}

.brand{
    position:absolute;
    bottom:3.5%;
    width:100%;
    text-align:center;
    color:rgba(255,255,255,.5);
    letter-spacing:6px;
    font-size:10px;
    font-weight:800;
    z-index:50;
}

.brand span{color:#168fff}

/* =====================================
   CÂMERA VIRTUAL
===================================== */

.camera-viewport{
    position:absolute;
    inset:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    transform-origin:center center;
    z-index:5;
    will-change:transform;
}

#scene-container{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.scene{
    position:absolute;
    width:100%;
    max-width:1050px;
    max-height:100%;
    padding:clamp(12px, 3.2%, 30px);
    text-align:center;
    opacity:0;
    visibility:hidden;
    transform:scale(var(--fit-scale, 1));
    transform-origin:center center;
}

.scene.active{
    visibility:visible;
    opacity:1;
}

.scene.leaving{
    visibility:visible;
    animation:sceneExit .5s ease-in forwards;
}

@keyframes sceneExit{
    to{
        opacity:0;
        transform:scale(.96) translateY(-25px);
        filter:blur(14px);
    }
}

/* =====================================
   ENTRADAS TIPOGRÁFICAS
===================================== */

.kicker{
    color:#42baff;
    font-size:clamp(10px,2vw,15px);
    letter-spacing:5px;
    font-weight:900;
    margin-bottom:23px;
    text-transform:uppercase;
    opacity:0;
    animation:kickerEnter .8s .1s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes kickerEnter{
    from{
        opacity:0;
        transform:translateY(-35px);
        letter-spacing:15px;
        filter:blur(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
        letter-spacing:5px;
        filter:blur(0);
    }
}

.headline{
    font-family:Anton,sans-serif;
    font-size:clamp(55px,11vw,135px);
    line-height:.98;
    text-transform:uppercase;
    color:white;
    letter-spacing:-1px;
}

.blue{
    color:#139cff;
    text-shadow:
    0 0 20px rgba(0,140,255,.8),
    0 0 65px rgba(0,100,255,.5);
}

.motion-line{
    display:block;
    margin:5px 0;
    overflow:visible;
}

.motion-word{
    display:inline-block;
    opacity:0;
    will-change:transform,opacity,filter;
}

.from-left{animation:enterLeft .9s cubic-bezier(.16,1,.3,1) both}
.from-right{animation:enterRight .9s cubic-bezier(.16,1,.3,1) both}
.from-top{animation:enterTop .9s cubic-bezier(.16,1,.3,1) both}
.from-bottom{animation:enterBottom .9s cubic-bezier(.16,1,.3,1) both}
.from-zoom{animation:zoomImpact .9s cubic-bezier(.16,1,.3,1) both}
.from-dissolve{animation:dissolveIn 1.1s ease-out both}
.from-tracking{animation:trackingIn 1.2s cubic-bezier(.16,1,.3,1) both}
.from-flip{animation:flipIn 1s cubic-bezier(.16,1,.3,1) both}
.from-blur{animation:blurIn 1.1s ease-out both}
.from-rotate{animation:rotateIn .9s cubic-bezier(.16,1,.3,1) both}
.from-mask{animation:maskIn 1s cubic-bezier(.77,0,.18,1) both}
.from-elastic{animation:elasticIn 1.2s cubic-bezier(.16,1,.3,1) both}
.from-glitch{animation:glitchIn .8s steps(1) both}
.from-letter{animation:letterReveal 1.2s ease-out both}

@keyframes enterLeft{
    0%{opacity:0;transform:translateX(-180px) skewX(20deg);filter:blur(15px)}
    70%{opacity:1;transform:translateX(8px) skewX(-3deg);filter:blur(0)}
    100%{opacity:1;transform:translateX(0)}
}

@keyframes enterRight{
    0%{opacity:0;transform:translateX(180px) skewX(-20deg);filter:blur(15px)}
    70%{opacity:1;transform:translateX(-8px) skewX(3deg);filter:blur(0)}
    100%{opacity:1;transform:translateX(0)}
}

@keyframes enterTop{
    0%{opacity:0;transform:translateY(-120px) scale(.8);filter:blur(15px)}
    70%{opacity:1;transform:translateY(8px) scale(1.05);filter:blur(0)}
    100%{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes enterBottom{
    0%{opacity:0;transform:translateY(120px);filter:blur(15px)}
    70%{opacity:1;transform:translateY(-8px);filter:blur(0)}
    100%{opacity:1;transform:translateY(0)}
}

@keyframes zoomImpact{
    0%{opacity:0;transform:scale(2.7);filter:blur(20px)}
    65%{opacity:1;transform:scale(.88);filter:blur(0)}
    100%{opacity:1;transform:scale(1)}
}

@keyframes dissolveIn{
    from{opacity:0;filter:blur(30px);transform:scale(1.15)}
    to{opacity:1;filter:blur(0);transform:scale(1)}
}

@keyframes trackingIn{
    from{opacity:0;letter-spacing:35px;transform:scale(1.15);filter:blur(10px)}
    to{opacity:1;letter-spacing:normal;transform:scale(1);filter:blur(0)}
}

@keyframes flipIn{
    from{opacity:0;transform:perspective(500px) rotateX(-90deg)}
    to{opacity:1;transform:perspective(500px) rotateX(0)}
}

@keyframes blurIn{
    from{opacity:0;filter:blur(30px);transform:translateY(30px)}
    to{opacity:1;filter:blur(0);transform:translateY(0)}
}

@keyframes rotateIn{
    from{opacity:0;transform:rotate(-15deg) scale(.5);filter:blur(12px)}
    to{opacity:1;transform:rotate(0) scale(1);filter:blur(0)}
}

@keyframes maskIn{
    from{opacity:0;clip-path:inset(0 100% 0 0)}
    to{opacity:1;clip-path:inset(0 0 0 0)}
}

@keyframes elasticIn{
    0%{opacity:0;transform:scale(.3)}
    60%{opacity:1;transform:scale(1.15)}
    80%{transform:scale(.95)}
    100%{opacity:1;transform:scale(1)}
}

@keyframes glitchIn{
    0%{opacity:0;transform:translateX(-15px);filter:blur(5px)}
    25%{opacity:1;transform:translateX(8px)}
    50%{transform:translateX(-5px)}
    75%{transform:translateX(3px);filter:blur(0)}
    100%{opacity:1;transform:translateX(0)}
}

@keyframes letterReveal{
    from{opacity:0;filter:blur(15px);letter-spacing:18px;transform:translateY(15px)}
    to{opacity:1;filter:blur(0);letter-spacing:normal;transform:translateY(0)}
}

/* =====================================
   SAÍDAS TIPOGRÁFICAS VARIADAS
===================================== */

.scene.leaving .motion-word:nth-child(6n+1){
    animation:exitLeft .45s ease-in forwards;
}

.scene.leaving .motion-word:nth-child(6n+2){
    animation:exitRight .45s ease-in forwards;
}

.scene.leaving .motion-word:nth-child(6n+3){
    animation:exitTop .45s ease-in forwards;
}

.scene.leaving .motion-word:nth-child(6n+4){
    animation:exitBottom .45s ease-in forwards;
}

.scene.leaving .motion-word:nth-child(6n+5){
    animation:exitDissolve .5s ease-in forwards;
}

.scene.leaving .motion-word:nth-child(6n+6){
    animation:exitZoom .45s ease-in forwards;
}

@keyframes exitLeft{
    to{opacity:0;transform:translateX(-120px) skewX(15deg);filter:blur(15px)}
}
@keyframes exitRight{
    to{opacity:0;transform:translateX(120px) skewX(-15deg);filter:blur(15px)}
}
@keyframes exitTop{
    to{opacity:0;transform:translateY(-100px);filter:blur(15px)}
}
@keyframes exitBottom{
    to{opacity:0;transform:translateY(100px);filter:blur(15px)}
}
@keyframes exitDissolve{
    to{opacity:0;transform:scale(1.2);filter:blur(30px)}
}
@keyframes exitZoom{
    to{opacity:0;transform:scale(.2);filter:blur(20px)}
}

/* =====================================
   SUBTÍTULOS COM ANIMAÇÃO INDEPENDENTE
===================================== */

.description{
    max-width:760px;
    margin:26px auto 0;
    color:rgba(255,255,255,.85);
    font-size:clamp(14px,2vw,19px);
    line-height:1.7;
    font-weight:500;
    opacity:0;
    animation:descriptionRise 1s 1.1s ease-out forwards;
}

.description strong{color:white}

@keyframes descriptionRise{
    from{opacity:0;transform:translateY(40px);filter:blur(12px)}
    to{opacity:1;transform:translateY(0);filter:blur(0)}
}

.scene.leaving .description{
    animation:descriptionExit .4s forwards;
}

@keyframes descriptionExit{
    to{opacity:0;transform:translateY(35px);filter:blur(12px)}
}

.separator{
    width:100px;
    height:3px;
    background:linear-gradient(90deg,transparent,#008cff,transparent);
    margin:22px auto;
    box-shadow:0 0 15px #008cff;
    animation:lineExpand .8s .5s ease-out both;
}

@keyframes lineExpand{
    from{width:0;opacity:0}
    to{width:100px;opacity:1}
}

/* =====================================
   ÍCONES
===================================== */

.instagram-icon{
    width:clamp(75px,13vw,135px);
    height:clamp(75px,13vw,135px);
    margin:0 auto 20px;
    filter:drop-shadow(0 0 25px rgba(0,145,255,.6));
    opacity:0;
    animation:instagramEnter .9s .2s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes instagramEnter{
    from{opacity:0;transform:scale(0) rotate(-90deg);filter:blur(15px)}
    to{opacity:1;transform:scale(1);filter:drop-shadow(0 0 25px #008cff)}
}

.icon-box{
    display:flex;
    align-items:center;
    justify-content:center;
    width:58px;
    height:58px;
    margin:0 auto 18px;
    border-radius:17px;
    color:#54bdff;
    border:1px solid rgba(0,155,255,.5);
    background:rgba(0,110,255,.13);
    box-shadow:0 0 30px rgba(0,120,255,.2);
    animation:elasticIn .9s .2s both;
}

.icon-box svg{
    width:32px;
    height:32px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =====================================
   CARTÕES DE FUNCIONALIDADES
===================================== */

.feature-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    max-width:790px;
    margin:24px auto 0;
}

.feature-card{
    padding:17px 19px;
    text-align:left;
    border:1px solid rgba(0,153,255,.3);
    background:linear-gradient(135deg,rgba(0,105,200,.22),rgba(0,0,0,.58));
    border-radius:12px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,.3);
    opacity:0;
    animation:cardEnter .75s cubic-bezier(.16,1,.3,1) both;
}

.feature-card:nth-child(1){animation-delay:.3s}
.feature-card:nth-child(2){animation-delay:.55s}

@keyframes cardEnter{
    from{opacity:0;transform:translateY(55px) scale(.85);filter:blur(12px)}
    to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

.feature-card:after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(100deg,transparent,rgba(0,150,255,.17),transparent);
    animation:shine 3s .8s infinite;
}

@keyframes shine{
    50%,100%{left:120%}
}

.feature-number{
    font-size:11px;
    color:#32adff;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
    animation:enterLeft .6s .5s both;
}

.feature-title{
    color:#fff;
    font-weight:900;
    font-size:clamp(13px,2vw,18px);
    margin-bottom:8px;
    animation:enterRight .65s .65s both;
}

.feature-text{
    color:rgba(255,255,255,.78);
    font-size:clamp(11px,1.4vw,14px);
    line-height:1.6;
    animation:dissolveIn .8s .9s both;
}

/* =====================================
   MAPA DO BRASIL
===================================== */

.map-scene{
    width:100%;
    max-width:1050px;
    padding:20px;
    text-align:center;
}

.map-heading{
    margin-bottom:15px;
}

.map-title{
    font-family:Anton,sans-serif;
    font-size:clamp(37px,7vw,75px);
    line-height:1;
    color:white;
    opacity:0;
    animation:enterTop .9s .2s both;
}

.map-title span{color:#159dff;text-shadow:0 0 35px #008cff}

.map-subtitle{
    color:#b8dfff;
    font-size:clamp(12px,1.7vw,17px);
    margin-top:13px;
    opacity:0;
    animation:descriptionRise .9s .7s both;
}

.map-layout{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    align-items:center;
    gap:12px;
    max-width:800px;
    margin:0 auto;
}

.brazil-map{
    width:100%;
    max-height:390px;
    overflow:visible;
    filter:drop-shadow(0 0 20px rgba(0,130,255,.25));
}

.brazil-shape{
    fill:rgba(0,115,255,.14);
    stroke:#31b4ff;
    stroke-width:2;
    stroke-dasharray:8 4;
    animation:mapDraw 3s ease-out forwards,mapPulse 3s 3s infinite alternate;
}

@keyframes mapDraw{
    from{stroke-dashoffset:1200;fill:rgba(0,115,255,0)}
    to{stroke-dashoffset:0;fill:rgba(0,115,255,.19)}
}

@keyframes mapPulse{
    to{fill:rgba(0,150,255,.3);stroke:#82d9ff}
}

.map-state-line{
    stroke:rgba(50,170,255,.23);
    stroke-width:1;
    fill:none;
}

.map-point{
    fill:#6ce5ff;
    stroke:#008cff;
    stroke-width:2;
    animation:mapPointPulse 1.8s ease-in-out infinite;
    transform-box:fill-box;
    transform-origin:center;
}

.map-point:nth-of-type(2n){animation-delay:.3s}
.map-point:nth-of-type(3n){animation-delay:.6s}

@keyframes mapPointPulse{
    0%,100%{opacity:.7;transform:scale(.8)}
    50%{opacity:1;transform:scale(1.8)}
}

.map-link{
    stroke:#159cff;
    stroke-width:1.5;
    stroke-dasharray:5 6;
    opacity:.6;
    animation:mapLines 3s linear infinite;
}

@keyframes mapLines{
    to{stroke-dashoffset:-55}
}

/* CONEXÕES VERMELHAS: pins e rotas animadas sobre o mapa original */
.map-link-red{
    fill:none;
    stroke:#ff294f;
    stroke-width:2.8;
    stroke-linecap:round;
    stroke-dasharray:7 8;
    opacity:.95;
    filter:drop-shadow(0 0 5px rgba(255,35,75,.9));
    animation:redRouteFlow 2.1s linear infinite;
}
@keyframes redRouteFlow{to{stroke-dashoffset:-60}}
.map-pin-halo{
    fill:rgba(255,35,75,.15);
    stroke:rgba(255,55,90,.85);
    stroke-width:1.8;
    transform-box:fill-box;
    transform-origin:center;
    animation:redPinPulse 1.5s ease-out infinite;
}
.map-pin-core{
    fill:#ff294f;
    stroke:#fff;
    stroke-width:1.8;
    filter:drop-shadow(0 0 7px #ff1748);
}
@keyframes redPinPulse{
    0%{transform:scale(.55);opacity:.95}
    100%{transform:scale(2.15);opacity:0}
}
.map-pin-group:nth-child(2n) .map-pin-halo{animation-delay:.35s}
.map-pin-group:nth-child(3n) .map-pin-halo{animation-delay:.7s}

/* Parallax discreto no mapa, sem alterar o enquadramento das demais cenas */
.map-layout{transform-style:preserve-3d;animation:mapParallax 7s ease-in-out infinite alternate;}
@keyframes mapParallax{
    from{transform:translate3d(-3px,2px,0) rotateX(1deg)}
    to{transform:translate3d(3px,-3px,0) rotateX(-1deg)}
}

.map-stat-panel{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.stat-card{
    padding:17px 12px;
    background:linear-gradient(140deg,rgba(0,100,220,.25),rgba(0,0,0,.7));
    border:1px solid rgba(0,160,255,.4);
    border-radius:14px;
    text-align:center;
    opacity:0;
    animation:cardEnter .8s cubic-bezier(.16,1,.3,1) forwards;
}

.stat-card:nth-child(2){animation-delay:.35s}
.stat-card:nth-child(3){animation-delay:.65s}

.stat-number{
    font-family:Anton,sans-serif;
    font-size:clamp(37px,6vw,67px);
    color:#26aaff;
    text-shadow:0 0 25px rgba(0,145,255,.65);
    line-height:1.05;
}

.stat-label{
    font-size:clamp(10px,1.5vw,13px);
    font-weight:800;
    color:white;
    margin-top:7px;
    line-height:1.4;
}

.map-caption{
    font-size:10px;
    color:rgba(255,255,255,.45);
    margin-top:10px;
}

/* =====================================
   DEPOIMENTOS ILUSTRATIVOS
===================================== */

.social-proof{
    max-width:800px;
    margin:20px auto 0;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.testimonial{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    padding:14px;
    background:linear-gradient(120deg,rgba(0,115,230,.18),rgba(0,0,0,.6));
    border:1px solid rgba(0,150,255,.32);
    border-radius:13px;
    opacity:0;
    animation:cardEnter .7s cubic-bezier(.16,1,.3,1) both;
}

.testimonial:nth-child(1){animation-delay:.3s}
.testimonial:nth-child(2){animation-delay:.6s}
.testimonial:nth-child(3){animation-delay:.9s}
.testimonial:nth-child(4){animation-delay:1.2s}

.avatar{
    width:45px;
    height:45px;
    min-width:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:15px;
    font-weight:900;
    background:linear-gradient(135deg,#006aff,#00baff,#763dff);
    box-shadow:0 0 15px rgba(0,140,255,.4);
}

.testimonial-text{
    color:#e7f4ff;
    font-size:clamp(10px,1.5vw,13px);
    line-height:1.5;
}

.testimonial-text strong{
    color:#46baff;
    display:block;
    margin-bottom:4px;
    font-size:11px;
}

function renderHeadline(lines){

    return lines.map((line,index)=>{

        const delay=(.18+index*.24).toFixed(2);

        const content=line.blue
        ? `<span class="blue">${line.html}</span>`
        : line.html;

        return `
        <span class="motion-line">
        <span class="motion-word ${line.effect}"
        style="animation-delay:${delay}s">
        ${content}
        </span>
        </span>`;

    }).join("");
}

/* ==========================================
   CÂMERA CINEMATOGRÁFICA SEGURA
========================================== */

const stage=document.getElementById("stage");
const camera=document.getElementById("camera");

let cameraAnimations=[];

function clearCamera(){

    cameraAnimations.forEach(a=>a.cancel());
    cameraAnimations=[];

    camera.style.transform="translate(0,0) scale(1)";
}

function safeZoom(target,maxZoom=1.075){

    const stageRect=stage.getBoundingClientRect();
    const rect=target.getBoundingClientRect();

    const margin=45;

    const availableW=stageRect.width-margin*2;
    const availableH=stageRect.height-margin*2;

    return Math.max(.98,Math.min(
        maxZoom,
        availableW/rect.width,
        availableH/rect.height
    ));
}

function focusPosition(target,scale){

    const sr=stage.getBoundingClientRect();
    const r=target.getBoundingClientRect();

    const cx=sr.left+sr.width/2;
    const cy=sr.top+sr.height/2;

    const tx=r.left+r.width/2;
    const ty=r.top+r.height/2;

    const maxX=sr.width*.022;
    const maxY=sr.height*.022;

    return {
        x:Math.max(-maxX,Math.min(maxX,(cx-tx)*(scale-1))),
        y:Math.max(-maxY,Math.min(maxY,(cy-ty)*(scale-1)))
    };
}

function runCamera(data,scene){

    clearCamera();

    if(data.camera==="map"){
        runMapCamera(data,scene);
        return;
    }
    if(data.camera==="world-map"){
        runWorldMapCamera(data,scene);
        return;
    }

    const duration=data.duration;

    const words=scene.querySelectorAll(".motion-word");

    const focus=Math.min(data.focus||0,words.length-1);

    const first=words[focus]||scene.querySelector(".headline")||scene;
    const second=words.length>1?words[(focus+1)%words.length]:first;

    const z1=safeZoom(first,1.07);
    const z2=safeZoom(second,1.07);

    const p1=focusPosition(first,z1);
    const p2=focusPosition(second,z2);

    const driftX=stage.clientWidth*.009;
    const driftY=stage.clientHeight*.007;
    const frames=[
        {offset:0,transform:"translate3d(0,0,0) scale(1)"},
        {offset:.18,transform:`translate3d(${p1.x-driftX}px,${p1.y+driftY}px,0) scale(${z1})`},
        {offset:.34,transform:`translate3d(${p1.x+driftX}px,${p1.y-driftY}px,0) scale(${z1*1.008})`},
        {offset:.51,transform:`translate3d(${(p1.x+p2.x)*.42}px,${(p1.y+p2.y)*.42}px,0) scale(${(z1+z2)/2})`},
        {offset:.69,transform:`translate3d(${p2.x+driftX}px,${p2.y-driftY}px,0) scale(${z2})`},
        {offset:.84,transform:`translate3d(${p2.x-driftX}px,${p2.y+driftY}px,0) scale(${z2*1.008})`},
        {offset:1,transform:`translate3d(${p2.x*.18}px,${p2.y*.18}px,0) scale(1.025)`}
    ];

    const animation=camera.animate(frames,{
        duration,
        easing:"cubic-bezier(.45,0,.25,1)",
        fill:"forwards"
    });

    cameraAnimations.push(animation);
}

/* ==========================================
   MOVIMENTO ESPECIAL DO MAPA
========================================== */

function runMapCamera(data,scene){
    scene.classList.add("drone-map-scene");
    const map=scene.querySelector(".brazil-map");
    if(!map)return;
    // A trajetória parte de cima do território e avança em diagonal, como um drone.
    const animation=camera.animate([
        {offset:0,transform:"translate3d(-5px,-38px,-180px) rotateX(15deg) rotateY(-5deg) scale(.72)",opacity:.18},
        {offset:.16,transform:"translate3d(-2px,-18px,0) rotateX(8deg) rotateY(-3deg) scale(.96)",opacity:1},
        {offset:.38,transform:"translate3d(12px,-42px,0) rotateX(13deg) rotateY(4deg) scale(1.22)",opacity:1},
        {offset:.62,transform:"translate3d(-18px,-72px,0) rotateX(17deg) rotateY(-4deg) scale(1.55)",opacity:1},
        {offset:.82,transform:"translate3d(10px,-95px,0) rotateX(12deg) rotateY(3deg) scale(1.92)",opacity:1},
        {offset:1,transform:"translate3d(22px,-120px,0) rotateX(5deg) rotateY(0deg) scale(2.25)",opacity:.78}
    ],{duration:data.duration,easing:"cubic-bezier(.42,0,.18,1)",fill:"forwards"});
    cameraAnimations.push(animation);
    map.animate([
        {transform:"translate3d(-12px,-30px,0) scale(.78) rotateX(8deg)",opacity:0,filter:"blur(12px)"},
        {transform:"translate3d(0,0,0) scale(1.04) rotateX(0deg)",opacity:1,filter:"blur(0px)",offset:.32},
        {transform:"translate3d(5px,-8px,0) scale(1.08) rotateX(2deg)",opacity:1,filter:"blur(0px)"}
    ],{duration:2300,easing:"cubic-bezier(.16,1,.3,1)",fill:"forwards"});
}

function runWorldMapCamera(data,scene){
    const map=scene.querySelector(".world-map-svg");
    if(!map)return;
    // Brasil está no quadrante inferior-esquerdo do mapa: deslocamos o quadro para lá.
    const animation=camera.animate([
      {offset:0,transform:"translate3d(0,18px,-180px) scale(.76) rotateX(12deg)",opacity:.25},
      {offset:.2,transform:"translate3d(-8px,0,0) scale(.92) rotateX(7deg)",opacity:1},
      {offset:.42,transform:"translate3d(12px,-10px,0) scale(1.08) rotateX(4deg)",opacity:1},
      {offset:.68,transform:"translate3d(30px,-34px,0) scale(1.42) rotateX(2deg)",opacity:1},
      {offset:.86,transform:"translate3d(72px,-82px,0) scale(2.08) rotateX(0deg)",opacity:1},
      {offset:1,transform:"translate3d(118px,-130px,0) scale(2.85) rotateX(-2deg)",opacity:0}
    ],{duration:data.duration,easing:"cubic-bezier(.38,0,.16,1)",fill:"forwards"});
    cameraAnimations.push(animation);
    map.animate([
      {transform:"scale(.82) translate3d(0,12px,0)",filter:"blur(8px)"},
      {transform:"scale(1) translate3d(0,0,0)",filter:"blur(0px)",offset:.25},
      {transform:"scale(1.05) translate3d(-1%,1%,0)",filter:"blur(0px)"}
    ],{duration:data.duration,easing:"cubic-bezier(.3,0,.2,1)",fill:"forwards"});
}


/* CARROSSEL: DESLIZAMENTO, CURSOR E CLIQUE SIMULADO */
function runCarouselDemo(scene,data){
    const track=scene.querySelector(".carousel-demo-track");
    const cards=[...scene.querySelectorAll(".carousel-demo-card")];
    const mouse=scene.querySelector(".demo-mouse");
    const ring=scene.querySelector(".demo-click-ring");
    const label=scene.querySelector(".demo-selected-label");
    const viewport=scene.querySelector(".carousel-demo-viewport");
    if(!track||!cards.length)return;
    const target=cards[3];
    const step=cards[1].offsetLeft-cards[0].offsetLeft;
    const viewportW=viewport.clientWidth;
    const centerTarget=target.offsetLeft+target.offsetWidth/2-viewportW/2;
    const maxMove=track.scrollWidth-viewportW;
    const finalX=-Math.max(0,Math.min(centerTarget,maxMove));
    const scroll=track.animate([
      {offset:0,transform:"translateX(0)"},
      {offset:.22,transform:`translateX(${-Math.min(step*1.1,maxMove)}px)`},
      {offset:.48,transform:`translateX(${-Math.min(step*2.3,maxMove)}px)`},
      {offset:.68,transform:`translateX(${finalX}px)`},
      {offset:1,transform:`translateX(${finalX}px)`}
    ],{duration:data.duration,fill:"forwards",easing:"cubic-bezier(.4,0,.2,1)"});
    const cursorX=viewport.offsetLeft+viewportW/2;
    const cursorY=viewport.offsetTop+viewport.clientHeight*.52;
    mouse.style.left=cursorX+"px";mouse.style.top=cursorY+"px";
    ring.style.left=cursorX+"px";ring.style.top=cursorY+"px";
    mouse.animate([{offset:0,opacity:0,transform:"translate(115px,95px) scale(1.2)"},{offset:.65,opacity:0,transform:"translate(115px,95px) scale(1.2)"},{offset:.79,opacity:1,transform:"translate(0,0) scale(1)"},{offset:.85,opacity:1,transform:"translate(0,0) scale(.8)"},{offset:.9,opacity:1,transform:"translate(0,0) scale(1)"},{offset:1,opacity:1,transform:"translate(0,0) scale(1)"}],{duration:data.duration,fill:"forwards"});
    const clickAt=data.duration*.84;
    const t=setTimeout(()=>{if(!scene.isConnected)return;target.classList.add("chosen");ring.classList.add("clicked");label.classList.add("visible");},clickAt);
    scene._carouselTimeout=t;
}

/* ==========================================
   FLASH
========================================== */

const flash=document.getElementById("flash");

function triggerFlash(){

    flash.classList.remove("hit");

    void flash.offsetWidth;

    flash.classList.add("hit");
}

/* ==========================================
   TIMELINE
========================================== */

const timeline=[];
let cursor=0;

scenes.forEach((scene,index)=>{

    timeline.push({
        index,
        start:cursor,
        end:cursor+scene.duration
    });

    cursor+=scene.duration;

});

const actualDuration=cursor;

const progress=document.getElementById("progress");
const counter=document.getElementById("counter");

let currentScene=null;
let currentIndex=-1;
let startTime=0;
let running=false;
let finished=false;

/* ==========================================
   TROCA DE CENAS
========================================== */

function fitSceneToStage(scene){
    if(!scene)return;
    scene.style.setProperty("--fit-scale","1");
    const stageRect=stage.getBoundingClientRect();
    const contentW=Math.max(scene.scrollWidth,scene.getBoundingClientRect().width);
    const contentH=Math.max(scene.scrollHeight,scene.getBoundingClientRect().height);
    const safeW=Math.max(1,stageRect.width-28);
    const safeH=Math.max(1,stageRect.height-110);
    const fit=Math.min(1,safeW/contentW,safeH/contentH);
    scene.style.setProperty("--fit-scale",String(Math.max(.68,fit)));
}

function showScene(index){

    if(index===currentIndex)return;

    if(currentScene){
        if(currentScene._carouselTimeout)clearTimeout(currentScene._carouselTimeout);
        currentScene.classList.remove("active");
        currentScene.classList.add("leaving");
    }

    clearCamera();

    currentIndex=index;

    const data=scenes[index];

    currentScene=createScene(data);
    const sceneCopy=[data.kicker,data.title,data.subtitle,data.description,...(data.lines||[]).map(x=>x.html)].join(" ").toLowerCase();
    if(sceneCopy.includes("instagram")||data.type==="instagram")currentScene.classList.add("context-instagram");

    requestAnimationFrame(()=>{

        currentScene.classList.add("active");
        fitSceneToStage(currentScene);

        requestAnimationFrame(()=>{
            fitSceneToStage(currentScene);
            if(data.type!=="stats-dashboard")runCamera(data,currentScene);
            if(data.type==="carousel-demo")runCarouselDemo(currentScene,data);
        });

    });

    if(data.type==="world-map"||data.type==="map-intro"||data.type==="map"){
        camera.style.filter="saturate(1.08) contrast(1.04)";
    } else { camera.style.filter="none"; }

    if(index===0||index===4||index===9||index===14){
        triggerFlash();
    }
}

/* ==========================================
   EXECUÇÃO
========================================== */

function animate(now){

    if(!running||finished)return;

    const time=Math.min(now-startTime,actualDuration);

    progress.style.width=(time/actualDuration*100)+"%";

    const seconds=Math.floor(time/1000);

    const total=Math.ceil(actualDuration/1000);

    counter.textContent=
        "00:"+String(seconds).padStart(2,"0")+
        " / 00:"+String(total).padStart(2,"0");

    const current=timeline.find(
        s=>time>=s.start&&time<s.end
    );

    if(current){
        showScene(current.index);
    }

    if(time>=actualDuration){
        finishMotion();
        return;
    }

    requestAnimationFrame(animate);
}

/* ==========================================
   FINALIZAÇÃO
========================================== */

function finishMotion(){

    if(finished)return;

    finished=true;
    running=false;

    progress.style.width="100%";

    const total=Math.floor(actualDuration/1000);

    counter.textContent=
        "00:"+String(total).padStart(2,"0")+
        " / 00:"+String(total).padStart(2,"0");

    // Retorno ao enquadramento normal.
    clearCamera();

    if(currentScene){
        currentScene.classList.remove("leaving");
        currentScene.classList.add("active");
    }

    console.log("MRO CINEMATIC MOTION 4.0 FINALIZADO");
}

/* ==========================================
   INICIALIZAÇÃO
========================================== */

function startMotion(){

    if(running||finished)return;

    running=true;
    startTime=performance.now();

    requestAnimationFrame(animate);
}

window.addEventListener("load",startMotion);

/* Reajusta a cena atual se a janela/orientação mudar durante a prévia. */
let resizeTimer;
window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
        if(currentScene){
            fitSceneToStage(currentScene);
        }
    },100);
});

</script>
