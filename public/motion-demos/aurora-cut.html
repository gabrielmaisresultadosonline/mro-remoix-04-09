<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRO Inteligente — Cinematic Motion 5.1 (Aurora Cut + Sound)</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --blue:#159cff;
  --blue-soft:#54c9ff;
  --violet:#8a5bff;
  --magenta:#ff2a78;
  --deep:#02060f;
}

body{
  background:#000;color:#fff;overflow:hidden;
  font-family:Montserrat,sans-serif;
}

/* ================= PALCO 9:16 ================= */
.stage{
  position:relative;
  width:min(100vw, 56.25vh);
  height:min(100vh, 177.7778vw);
  aspect-ratio:9 / 16;
  max-width:100vw;max-height:100vh;
  overflow:hidden;margin:auto;
  display:flex;justify-content:center;align-items:center;
  isolation:isolate;
  background:radial-gradient(ellipse at 50% 45%, #061a33 0%, #020812 55%, #000 100%);
}

/* ================= GATE (TAP TO PLAY) ================= */
.gate{
  position:absolute;inset:0;z-index:200;
  background:radial-gradient(ellipse at 50% 50%, rgba(6,26,51,.92) 0%, rgba(0,3,10,.97) 100%);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;place-items:center;cursor:pointer;
  transition:opacity .6s ease;
}
.gate.hidden{opacity:0;pointer-events:none}
.gate-inner{text-align:center;padding:20px;animation:gatePulse 2.4s ease-in-out infinite}
@keyframes gatePulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
.gate-ring{
  width:96px;height:96px;margin:0 auto 26px;
  border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle, rgba(0,120,255,.35) 0%, transparent 70%);
  position:relative;
}
.gate-ring:before,.gate-ring:after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid rgba(60,180,255,.55);
  animation:ringPulse 2s ease-out infinite;
}
.gate-ring:after{animation-delay:1s}
@keyframes ringPulse{
  0%{transform:scale(.9);opacity:1}
  100%{transform:scale(1.9);opacity:0}
}
.gate-ring svg{
  width:38px;height:38px;
  fill:none;stroke:#5bd4ff;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 14px #159cff);
}
.gate-title{
  font-family:Anton,sans-serif;
  font-size:clamp(22px,6vw,34px);
  letter-spacing:5px;color:#fff;line-height:1.1;
  text-shadow:0 0 24px rgba(0,150,255,.7);
  margin-bottom:12px;
}
.gate-title span{color:#3bbdff}
.gate-sub{
  font-size:clamp(10px,2.4vw,13px);
  letter-spacing:3px;color:rgba(180,220,255,.7);
  font-weight:700;font-family:"JetBrains Mono",monospace;
}
.gate-hint{
  margin-top:20px;
  font-size:10px;letter-spacing:2px;
  color:rgba(150,190,230,.45);
}

/* ================= MUTE BUTTON ================= */
.mute-btn{
  position:absolute;top:3.5%;left:6%;
  width:34px;height:34px;
  background:rgba(0,90,190,.22);
  border:1px solid rgba(60,180,255,.42);
  border-radius:4px;
  color:#7ad4ff;cursor:pointer;z-index:60;
  display:grid;place-items:center;
  transition:all .2s;
  backdrop-filter:blur(4px);
}
.mute-btn:hover{
  background:rgba(0,120,255,.35);
  border-color:rgba(100,200,255,.8);
  transform:scale(1.05);
}
.mute-btn svg{
  width:16px;height:16px;
  stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.mute-btn.muted{
  color:rgba(255,110,140,.85);
  border-color:rgba(255,110,140,.45);
}

/* ================= AURORA LÍQUIDA ================= */
.aurora{position:absolute;inset:-25%;z-index:-5;filter:blur(70px);opacity:.85}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora .a1{width:65%;height:65%;left:-10%;top:-10%;
  background:radial-gradient(circle,#0079ff 0%,transparent 65%);
  animation:aurora1 14s ease-in-out infinite alternate;}
.aurora .a2{width:55%;height:55%;right:-8%;top:6%;
  background:radial-gradient(circle,#7c37ff 0%,transparent 65%);
  animation:aurora2 17s ease-in-out infinite alternate;}
.aurora .a3{width:70%;height:60%;left:10%;bottom:-15%;
  background:radial-gradient(circle,#00d5ff 0%,transparent 62%);
  animation:aurora3 19s ease-in-out infinite alternate;}
.aurora .a4{width:40%;height:40%;right:8%;bottom:5%;
  background:radial-gradient(circle,#ff2a78 0%,transparent 60%);
  opacity:.45;
  animation:aurora2 22s ease-in-out infinite alternate-reverse;}
@keyframes aurora1{to{transform:translate(18%,12%) scale(1.35)}}
@keyframes aurora2{to{transform:translate(-15%,18%) scale(1.25)}}
@keyframes aurora3{to{transform:translate(12%,-15%) scale(1.4)}}

.skyline{
  position:absolute;inset:-30%;z-index:-4;
  background-image:
    linear-gradient(rgba(0,140,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,140,255,.05) 1px,transparent 1px);
  background-size:80px 80px;
  transform:perspective(720px) rotateX(62deg) translateY(-8%);
  mask-image:radial-gradient(ellipse at 50% 60%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 60%,#000 20%,transparent 78%);
  animation:skyDrift 26s linear infinite;
}
@keyframes skyDrift{to{transform:perspective(720px) rotateX(62deg) translateY(calc(-8% + 80px))}}

.beams{position:absolute;inset:0;z-index:-3;overflow:hidden;pointer-events:none}
.beam{
  position:absolute;top:-30%;width:16%;height:130%;
  background:linear-gradient(180deg,transparent, rgba(30,150,255,.09) 30%, transparent 85%);
  transform-origin:top center;filter:blur(22px);
  animation:beamSway 12s ease-in-out infinite alternate;
}
.beam:nth-child(1){left:8%;animation-delay:-2s}
.beam:nth-child(2){left:34%;width:10%;background:linear-gradient(180deg,transparent, rgba(140,80,255,.08) 30%, transparent 85%);animation-delay:-6s}
.beam:nth-child(3){left:62%;animation-delay:-4s}
.beam:nth-child(4){left:82%;width:12%;background:linear-gradient(180deg,transparent, rgba(0,200,255,.07) 30%, transparent 85%);animation-delay:-9s}
@keyframes beamSway{
  from{transform:rotate(-6deg) translateX(-8px)}
  to{transform:rotate(7deg) translateX(10px)}
}

#sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:-2}
.spark{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#bde6ff;box-shadow:0 0 10px #4fc2ff,0 0 20px #159cff;
  animation:sparkTwinkle var(--t) ease-in-out infinite alternate,
            sparkFloat var(--f) linear infinite;
  opacity:0;
}
@keyframes sparkTwinkle{0%,100%{opacity:.08}50%{opacity:1}}
@keyframes sparkFloat{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(var(--mx),-110vh,0)}
}

.grain{
  position:absolute;inset:0;pointer-events:none;z-index:38;
  opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation:grainShift 6s steps(5) infinite;
}
@keyframes grainShift{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-3%,2%)}
  50%{transform:translate(2%,-3%)}
  75%{transform:translate(-2%,-1%)}
}
.scanlines{
  position:absolute;inset:0;pointer-events:none;z-index:37;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.55;
}
.vignette{
  position:absolute;inset:0;pointer-events:none;z-index:36;
  background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.75) 100%);
}

.hud-frame{position:absolute;inset:3%;pointer-events:none;z-index:34}
.hud-corner{position:absolute;width:22px;height:22px;border:0 solid rgba(120,200,255,.6);}
.hud-corner.tl{top:0;left:0;border-top-width:2px;border-left-width:2px}
.hud-corner.tr{top:0;right:0;border-top-width:2px;border-right-width:2px}
.hud-corner.bl{bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.hud-corner.br{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}

.progress{
  position:absolute;top:0;left:0;height:3px;width:0;
  background:linear-gradient(90deg,#006dff,#00e5ff,#b04bff);
  box-shadow:0 0 18px #00aaff,0 0 30px #4f8fff;
  z-index:50;
}
.counter{
  position:absolute;top:4.2%;right:6%;
  font-family:"JetBrains Mono",monospace;
  color:rgba(200,230,255,.75);
  font-size:10px;letter-spacing:2px;font-weight:700;
  z-index:50;
  text-shadow:0 0 12px rgba(0,160,255,.5);
}
.brand{
  position:absolute;bottom:3.5%;width:100%;text-align:center;
  color:rgba(255,255,255,.42);
  letter-spacing:7px;font-size:9px;font-weight:800;
  z-index:50;
}
.brand span{color:#46bdff;text-shadow:0 0 12px rgba(0,160,255,.7)}

#wipe{
  position:absolute;top:-25%;bottom:-25%;width:55%;left:-70%;
  background:linear-gradient(90deg,transparent 0%,#0a4d8f 32%,#54c9ff 50%,#0a4d8f 68%,transparent 100%);
  transform:skewX(-16deg);filter:blur(10px);
  opacity:0;pointer-events:none;z-index:46;
}
#wipe.sweep{animation:wipeSweep .68s cubic-bezier(.65,0,.35,1) forwards}
@keyframes wipeSweep{
  0%{left:-70%;opacity:1}
  100%{left:130%;opacity:1}
}

.flash{position:absolute;inset:0;background:#dff4ff;opacity:0;pointer-events:none;z-index:44;mix-blend-mode:screen}
.flash.hit{animation:flashHit .45s ease-out}
@keyframes flashHit{0%{opacity:0}12%{opacity:.62}100%{opacity:0}}

.camera-viewport{
  position:absolute;inset:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transform-origin:center center;z-index:5;will-change:transform;
}
#scene-container{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}
.scene{
  position:absolute;width:100%;max-width:1050px;max-height:100%;
  padding:clamp(12px, 3.2%, 30px);
  text-align:center;
  opacity:0;visibility:hidden;
  transform:scale(var(--fit-scale,1));
  transform-origin:center center;
}
.scene.active{visibility:visible;opacity:1}
.scene.leaving{visibility:visible;animation:sceneExit .42s ease-in forwards}
@keyframes sceneExit{
  to{opacity:0;transform:scale(.94) translateY(-22px);filter:blur(16px)}
}

.kicker{
  display:inline-block;
  color:#66cfff;
  font-size:clamp(9px,1.85vw,14px);
  letter-spacing:6px;font-weight:900;
  text-transform:uppercase;
  margin-bottom:22px;
  padding:6px 14px;
  border:1px solid rgba(60,170,255,.35);
  border-radius:2px;
  background:rgba(0,90,200,.12);
  backdrop-filter:blur(4px);
  box-shadow:0 0 22px rgba(0,140,255,.15) inset;
  opacity:0;
  animation:kickerIn .9s .05s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes kickerIn{
  from{opacity:0;transform:translateY(-16px);letter-spacing:16px;filter:blur(10px)}
  to{opacity:1;transform:translateY(0);letter-spacing:6px;filter:blur(0)}
}

.headline{
  font-family:Anton,sans-serif;
  font-size:clamp(55px,11vw,135px);
  line-height:.96;text-transform:uppercase;color:#fff;
  letter-spacing:-1px;
}
.blue{
  color:#2fb6ff;
  text-shadow:
    0 0 20px rgba(0,150,255,.85),
    0 0 60px rgba(0,110,255,.55),
    0 0 110px rgba(70,60,255,.35);
}
.motion-line{display:block;margin:4px 0;overflow:visible}
.motion-word{display:inline-block;opacity:0;will-change:transform,opacity,filter,clip-path}

.fx-wipe{animation:fxWipe .95s cubic-bezier(.2,.9,.2,1) both}
@keyframes fxWipe{
  0%{opacity:0;clip-path:inset(0 100% 0 0);filter:blur(6px)}
  60%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}
  100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}
}
.fx-chroma{animation:fxChroma 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes fxChroma{
  0%{opacity:0;filter:drop-shadow(-18px 0 0 #ff2a55) drop-shadow(18px 0 0 #00e5ff) blur(14px);transform:scale(1.18)}
  45%{opacity:1;filter:drop-shadow(-9px 0 0 #ff2a55) drop-shadow(9px 0 0 #00e5ff) blur(2px);transform:scale(1.02)}
  72%{filter:drop-shadow(-3px 0 0 #ff2a55) drop-shadow(3px 0 0 #00e5ff) blur(0)}
  100%{opacity:1;filter:drop-shadow(0 0 0 transparent) drop-shadow(0 0 0 transparent) blur(0);transform:scale(1)}
}
.fx-drift{animation:fxDrift 1s ease-out both}
@keyframes fxDrift{
  from{opacity:0;transform:translateY(65px) scale(.94);filter:blur(18px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
.fx-elastic{animation:fxElastic 1.25s cubic-bezier(.16,1,.3,1) both}
@keyframes fxElastic{
  0%{opacity:0;transform:scale(.25) rotate(-4deg)}
  55%{opacity:1;transform:scale(1.14) rotate(1deg)}
  78%{transform:scale(.96) rotate(-.4deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.fx-spin3d{animation:fxSpin3d 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes fxSpin3d{
  0%{opacity:0;transform:perspective(700px) rotateY(-118deg) translateZ(180px) scale(.8);filter:blur(16px)}
  100%{opacity:1;transform:perspective(700px) rotateY(0deg) translateZ(0) scale(1);filter:blur(0)}
}
.fx-glitch{animation:fxGlitch .95s steps(1) both}
@keyframes fxGlitch{
  0%{opacity:0;transform:translateX(-18px) skewX(18deg);filter:drop-shadow(-14px 0 #ff2a55) drop-shadow(14px 0 #00e5ff) blur(8px)}
  18%{opacity:1;transform:translateX(10px) skewX(-8deg)}
  32%{transform:translateX(-7px) skewX(4deg);filter:drop-shadow(-6px 0 #ff2a55) drop-shadow(6px 0 #00e5ff) blur(2px)}
  48%{transform:translateX(5px) skewX(-2deg)}
  64%{transform:translateX(-3px) skewX(1deg);filter:drop-shadow(-2px 0 #ff2a55) drop-shadow(2px 0 #00e5ff) blur(0)}
  100%{opacity:1;transform:translateX(0) skewX(0);filter:drop-shadow(0 0 transparent) drop-shadow(0 0 transparent) blur(0)}
}
.fx-cascade{animation:fxCascade 1.25s cubic-bezier(.16,1,.3,1) both}
@keyframes fxCascade{
  0%{opacity:0;letter-spacing:52px;filter:blur(22px);transform:translateY(18px)}
  60%{opacity:1;letter-spacing:2px;filter:blur(0);transform:translateY(0)}
  100%{opacity:1;letter-spacing:normal;filter:blur(0)}
}
.fx-curtain{animation:fxCurtain 1s cubic-bezier(.7,0,.2,1) both}
@keyframes fxCurtain{
  0%{opacity:0;clip-path:inset(0 0 100% 0)}
  55%{opacity:1;clip-path:inset(0 0 0 0)}
  100%{opacity:1;clip-path:inset(0 0 0 0)}
}
.fx-split{animation:fxSplit 1.05s cubic-bezier(.16,1,.3,1) both}
@keyframes fxSplit{
  0%{opacity:0;clip-path:inset(0 50% 0 50%);filter:blur(10px)}
  60%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}
  100%{opacity:1;clip-path:inset(0 0 0 0);filter:blur(0)}
}
.fx-whip{animation:fxWhip 1s cubic-bezier(.16,1,.3,1) both}
@keyframes fxWhip{
  0%{opacity:0;transform:translateX(-220%) skewX(38deg) scaleX(1.5);filter:blur(26px)}
  60%{opacity:1;transform:translateX(6%) skewX(-4deg) scaleX(.98);filter:blur(0)}
  100%{opacity:1;transform:translateX(0) skewX(0) scaleX(1)}
}
.fx-zoomblur{animation:fxZoomBlur 1s cubic-bezier(.16,1,.3,1) both}
@keyframes fxZoomBlur{
  0%{opacity:0;transform:scale(2.6);filter:blur(30px)}
  60%{opacity:1;transform:scale(.92);filter:blur(0)}
  100%{opacity:1;transform:scale(1)}
}
.fx-liquid{animation:fxLiquid 1.1s cubic-bezier(.16,1,.3,1) both}
@keyframes fxLiquid{
  0%{opacity:0;clip-path:circle(0% at 18% 60%);transform:scale(1.1);filter:blur(10px)}
  55%{opacity:1;clip-path:circle(120% at 18% 60%);filter:blur(0)}
  100%{opacity:1;clip-path:circle(150% at 18% 60%);transform:scale(1)}
}

.scene.leaving .motion-word:nth-child(4n+1){animation:exitUp .4s ease-in forwards}
.scene.leaving .motion-word:nth-child(4n+2){animation:exitDown .4s ease-in forwards}
.scene.leaving .motion-word:nth-child(4n+3){animation:exitZoomOut .4s ease-in forwards}
.scene.leaving .motion-word:nth-child(4n+4){animation:exitBlur .42s ease-in forwards}
@keyframes exitUp{to{opacity:0;transform:translateY(-80px);filter:blur(14px)}}
@keyframes exitDown{to{opacity:0;transform:translateY(80px);filter:blur(14px)}}
@keyframes exitZoomOut{to{opacity:0;transform:scale(1.6);filter:blur(22px)}}
@keyframes exitBlur{to{opacity:0;transform:scale(.6);filter:blur(20px)}}

.description{
  max-width:760px;margin:24px auto 0;
  color:rgba(255,255,255,.86);
  font-size:clamp(14px,2vw,19px);
  line-height:1.65;font-weight:500;
  opacity:0;
  animation:descIn 1s 1.15s ease-out forwards;
}
.description strong{color:#fff}
@keyframes descIn{
  from{opacity:0;transform:translateY(35px);filter:blur(12px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}
.scene.leaving .description{animation:descOut .35s forwards}
@keyframes descOut{to{opacity:0;transform:translateY(30px);filter:blur(12px)}}

.separator{
  width:120px;height:2px;margin:20px auto;
  background:linear-gradient(90deg,transparent,#00aaff,#b04bff,transparent);
  box-shadow:0 0 18px #008cff,0 0 34px rgba(140,80,255,.4);
  animation:sepIn .9s .55s ease-out both;
}
@keyframes sepIn{from{width:0;opacity:0}to{width:120px;opacity:1}}

.icon-shell{
  position:relative;width:78px;height:78px;margin:0 auto 22px;
  display:grid;place-items:center;
  animation:iconPop .95s .15s cubic-bezier(.16,1,.3,1) both;
}
.icon-shell:before,.icon-shell:after{
  content:"";position:absolute;inset:0;
  border:1.5px solid rgba(60,180,255,.55);
  border-radius:22%;
  animation:iconSpin 8s linear infinite;
}
.icon-shell:after{
  inset:-8px;border-style:dashed;border-color:rgba(140,90,255,.4);
  animation-duration:13s;animation-direction:reverse;
}
@keyframes iconSpin{to{transform:rotate(360deg)}}
@keyframes iconPop{
  0%{opacity:0;transform:scale(0) rotate(-50deg);filter:blur(16px)}
  100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}
}
.icon-shell svg{
  position:relative;z-index:2;
  width:34px;height:34px;
  stroke:#7bd4ff;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 12px rgba(0,160,255,.8));
}

.ig-ring{
  position:relative;width:clamp(80px,14vw,140px);height:clamp(80px,14vw,140px);
  margin:0 auto 18px;display:grid;place-items:center;
  animation:igPop 1s .15s cubic-bezier(.16,1,.3,1) both;
}
.ig-ring:before{
  content:"";position:absolute;inset:-10px;border-radius:50%;
  background:conic-gradient(from 0deg,#006dff,#00e5ff,#8a5bff,#ff2a78,#006dff);
  filter:blur(16px);opacity:.55;
  animation:igSpinGlow 5s linear infinite;
}
@keyframes igSpinGlow{to{transform:rotate(360deg)}}
@keyframes igPop{
  0%{opacity:0;transform:scale(.2) rotate(-90deg);filter:blur(20px)}
  100%{opacity:1;transform:scale(1) rotate(0);filter:blur(0)}
}
.ig-ring svg{
  position:relative;width:100%;height:100%;
  filter:drop-shadow(0 0 25px rgba(0,150,255,.7));
}

.feature-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:13px;
  max-width:790px;margin:22px auto 0;
}
.feature-card{
  position:relative;padding:17px 19px;text-align:left;
  border:1px solid rgba(0,153,255,.28);
  background:linear-gradient(135deg,rgba(0,95,190,.22),rgba(0,0,0,.62));
  border-radius:4px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px rgba(120,200,255,.06) inset;
  opacity:0;
  animation:cardIn .8s cubic-bezier(.16,1,.3,1) both;
}
.feature-card:nth-child(1){animation-delay:.35s}
.feature-card:nth-child(2){animation-delay:.62s}
@keyframes cardIn{
  from{opacity:0;transform:translateY(55px) rotateX(-25deg) scale(.9);filter:blur(12px)}
  to{opacity:1;transform:translateY(0) rotateX(0) scale(1);filter:blur(0)}
}
.feature-card:before,.feature-card:after{
  content:"";position:absolute;width:14px;height:14px;
  border-color:rgba(90,200,255,.9);
}

.map-link{stroke:#159cff;stroke-width:1.5;stroke-dasharray:5 6;opacity:.55;animation:mapLines 3s linear infinite}

}

<script>

/* ==========================================
   MOTOR DE ÁUDIO (Web Audio API — sintetizado)
========================================== */
const AudioEngine = {
  ctx: null,
  master: null,
  enabled: false,
  muted: false,

  init(){
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.38;
      this.master.connect(this.ctx.destination);
    } catch(e){ this.ctx = null; }
  },

  resume(){
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },

  setMuted(m){
    this.muted = m;
    if (this.master){
      const t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.linearRampToValueAtTime(m ? 0 : 0.38, t + 0.15);
    }
  },

  noiseBuffer(duration){
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * duration, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  },

  /* WHOOSH — transição de cena */
  whoosh(duration = 0.55, vol = 0.32){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer(duration);

    const filter = this.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 3.2;
    filter.frequency.setValueAtTime(350, t);
    filter.frequency.exponentialRampToValueAtTime(5200, t + duration * 0.5);
    filter.frequency.exponentialRampToValueAtTime(500, t + duration);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + duration * 0.25);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    noise.connect(filter).connect(gain).connect(this.master);
    noise.start(t); noise.stop(t + duration);
  },

  /* IMPACT — boom de cena de impacto */
  impact(){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(130, t);
    osc.frequency.exponentialRampToValueAtTime(32, t + 0.45);
    const g1 = this.ctx.createGain();
    g1.gain.setValueAtTime(0.75, t);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    osc.connect(g1).connect(this.master);
    osc.start(t); osc.stop(t + 0.6);

    // burst de ruído grave
    const noise = this.ctx.createBufferSource();
    noise.buffer = this.noiseBuffer(0.28);
    const lp = this.ctx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 1800;
    const g2 = this.ctx.createGain();
    g2.gain.setValueAtTime(0.35, t);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    noise.connect(lp).connect(g2).connect(this.master);
    noise.start(t); noise.stop(t + 0.32);
  },

  /* STING — plink curto para letras */
  sting(delay = 0, pitch = 1){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(240 * pitch, t);
    osc.frequency.exponentialRampToValueAtTime(460 * pitch, t + 0.08);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + 0.2);
  },

  /* PING — sonar de pin */
  ping(){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(920, t);
    osc.frequency.exponentialRampToValueAtTime(1380, t + 0.12);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.28, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + 0.52);
  },

  /* CLICK — UI/carrossel */
  click(){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(1250, t);
    osc.frequency.exponentialRampToValueAtTime(620, t + 0.05);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.13, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + 0.1);
  },

  /* CHIME — ícone aparecendo */
  chime(){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    [880, 1320, 1760].forEach((f, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = f;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.06 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.5);
      osc.connect(g).connect(this.master);
      osc.start(t + i * 0.06);
      osc.stop(t + i * 0.06 + 0.55);
    });
  },

  /* DRONE — camera de mapa (rumble de drone) */
  drone(duration = 4){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator();
    o1.type = "sawtooth";
    o1.frequency.value = 46;
    const o2 = this.ctx.createOscillator();
    o2.type = "sawtooth";
    o2.frequency.value = 47.8;

    const filter = this.ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 240;
    filter.Q.value = 2;

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.1, t + 0.5);
    g.gain.setValueAtTime(0.1, t + duration - 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    o1.connect(filter); o2.connect(filter);
    filter.connect(g).connect(this.master);
    o1.start(t); o2.start(t);
    o1.stop(t + duration); o2.stop(t + duration);
  },

  /* RISE — gráfico subindo */
  rise(duration = 3.5){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, t);
    osc.frequency.exponentialRampToValueAtTime(1050, t + duration);

    const filter = this.ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 1400;

    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);

    osc.connect(filter).connect(g).connect(this.master);
    osc.start(t); osc.stop(t + duration);
  },

  /* CHORD — acorde final sustentado */
  chord(){
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    [261.63, 329.63, 392.00, 523.25, 659.25].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.1, t + 0.15 + i * 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
      osc.connect(g).connect(this.master);
      osc.start(t); osc.stop(t + 2.9);
    });
  }
};

/* ==========================================
   HEADLINE RENDER
========================================== */
function renderHeadline(lines){
  return lines.map((line, i) => {
    const delay = (.15 + i * .22).toFixed(2);
    const content = line.blue ? `<span class="blue">${line.html}</span>` : line.html;
    return `<span class="motion-line"><span class="motion-word ${line.effect}"
      style="animation-delay:${delay}s">${content}</span></span>`;
  }).join("");
}

/* ==========================================
   CÂMERA
========================================== */
const stage = document.getElementById("stage");
const camera = document.getElementById("camera");
let cameraAnims = [];

function clearCamera(){
  cameraAnims.forEach(a => a.cancel());
  cameraAnims = [];
  camera.style.transform = "translate(0,0) scale(1)";
}

function safeZoom(target, maxZoom = 1.075){
  const sr = stage.getBoundingClientRect();
  const r  = target.getBoundingClientRect();
  const margin = 45;
  const availW = sr.width  - margin * 2;
  const availH = sr.height - margin * 2;
  return Math.max(.98, Math.min(maxZoom, availW / r.width, availH / r.height));
}

function focusPosition(target, scale){
  const sr = stage.getBoundingClientRect();
  const r  = target.getBoundingClientRect();
  const cx = sr.left + sr.width / 2;
  const cy = sr.top  + sr.height / 2;
  const tx = r.left + r.width / 2;
  const ty = r.top  + r.height / 2;
  const maxX = sr.width  * .022;
  const maxY = sr.height * .022;
  return {
    x: Math.max(-maxX, Math.min(maxX, (cx - tx) * (scale - 1))),
    y: Math.max(-maxY, Math.min(maxY, (cy - ty) * (scale - 1)))
  };
}

function runCamera(data, scene){
  clearCamera();
  if (data.camera === "map"){ runMapCamera(data, scene); return; }
  if (data.camera === "world-map"){ runWorldMapCamera(data, scene); return; }

  const duration = data.duration;
  const words = scene.querySelectorAll(".motion-word");
  const focus = Math.min(data.focus || 0, Math.max(0, words.length - 1));

  const first  = words[focus] || scene.querySelector(".headline") || scene;
  const second = words.length > 1 ? words[(focus + 1) % words.length] : first;

  const z1 = safeZoom(first, 1.07);
  const z2 = safeZoom(second, 1.07);
  const p1 = focusPosition(first, z1);
  const p2 = focusPosition(second, z2);

  const dx = stage.clientWidth  * .009;
  const dy = stage.clientHeight * .007;

  const frames = [
    { offset:0,    transform:`translate3d(0,0,0) scale(1.10) rotate(.5deg)` },
    { offset:.10,  transform:`translate3d(0,0,0) scale(1.01) rotate(0deg)` },
    { offset:.26,  transform:`translate3d(${p1.x - dx}px,${p1.y + dy}px,0) scale(${z1})` },
    { offset:.42,  transform:`translate3d(${p1.x + dx}px,${p1.y - dy}px,0) scale(${z1 * 1.008})` },
    { offset:.58,  transform:`translate3d(${(p1.x + p2.x) * .45}px,${(p1.y + p2.y) * .45}px,0) scale(${(z1 + z2) / 2})` },
    { offset:.76,  transform:`translate3d(${p2.x + dx}px,${p2.y - dy}px,0) scale(${z2})` },
    { offset:.9,   transform:`translate3d(${p2.x - dx}px,${p2.y + dy}px,0) scale(${z2 * 1.008})` },
    { offset:1,    transform:`translate3d(${p2.x * .18}px,${p2.y * .18}px,0) scale(1.025) rotate(-.4deg)` }
  ];

  const anim = camera.animate(frames, {
    duration, easing:"cubic-bezier(.42,0,.2,1)", fill:"forwards"
  });
  cameraAnims.push(anim);
}

function runMapCamera(data, scene){
  scene.classList.add("drone-map-scene");
  const map = scene.querySelector(".brazil-map");
  if (!map) return;

  const anim = camera.animate([
    { offset:0,   transform:"translate3d(-6px,-40px,-200px) rotateX(16deg) rotateY(-6deg) scale(.7)",  opacity:.15 },
    { offset:.16, transform:"translate3d(-2px,-18px,0)       rotateX(8deg)  rotateY(-3deg) scale(.96)", opacity:1 },
    { offset:.38, transform:"translate3d(14px,-44px,0)       rotateX(13deg) rotateY(5deg)  scale(1.22)",opacity:1 },
    { offset:.62, transform:"translate3d(-20px,-74px,0)      rotateX(17deg) rotateY(-4deg) scale(1.55)",opacity:1 },
    { offset:.82, transform:"translate3d(12px,-98px,0)       rotateX(12deg) rotateY(3deg)  scale(1.92)",opacity:1 },
    { offset:1,   transform:"translate3d(24px,-124px,0)      rotateX(4deg)  rotateY(0deg)  scale(2.28)",opacity:.75 }
  ], { duration:data.duration, easing:"cubic-bezier(.42,0,.18,1)", fill:"forwards" });
  cameraAnims.push(anim);

  map.animate([
    { transform:"translate3d(-14px,-32px,0) scale(.76) rotateX(9deg)", opacity:0, filter:"blur(14px)" },
    { transform:"translate3d(0,0,0) scale(1.04) rotateX(0deg)", opacity:1, filter:"blur(0px)", offset:.32 },
    { transform:"translate3d(6px,-9px,0) scale(1.09) rotateX(2deg)", opacity:1, filter:"blur(0px)" }
  ], { duration:2300, easing:"cubic-bezier(.16,1,.3,1)", fill:"forwards" });
}

function runWorldMapCamera(data, scene){
  const map = scene.querySelector(".world-map-svg");
  if (!map) return;

  const anim = camera.animate([
    { offset:0,   transform:"translate3d(0,20px,-200px) scale(.74) rotateX(13deg)", opacity:.22 },
    { offset:.2,  transform:"translate3d(-9px,0,0)      scale(.92) rotateX(7deg)",  opacity:1 },
    { offset:.42, transform:"translate3d(14px,-12px,0)  scale(1.08) rotateX(4deg)", opacity:1 },
    { offset:.68, transform:"translate3d(34px,-38px,0)  scale(1.44) rotateX(2deg)", opacity:1 },
    { offset:.86, transform:"translate3d(78px,-88px,0)  scale(2.1)  rotateX(0deg)", opacity:1 },
    { offset:1,   transform:"translate3d(124px,-138px,0) scale(2.9) rotateX(-2deg)",opacity:0 }
  ], { duration:data.duration, easing:"cubic-bezier(.38,0,.16,1)", fill:"forwards" });
  cameraAnims.push(anim);

  map.animate([
    { transform:"scale(.82) translate3d(0,14px,0)", filter:"blur(9px)" },
    { transform:"scale(1) translate3d(0,0,0)",      filter:"blur(0px)", offset:.25 },
    { transform:"scale(1.05) translate3d(-1%,1%,0)",filter:"blur(0px)" }
  ], { duration:data.duration, easing:"cubic-bezier(.3,0,.2,1)", fill:"forwards" });
}

function runCarouselDemo(scene, data){
  const track    = scene.querySelector(".carousel-demo-track");
  const cards    = [...scene.querySelectorAll(".carousel-demo-card")];
  const mouse    = scene.querySelector(".demo-mouse");
  const ring     = scene.querySelector(".demo-click-ring");
  const label    = scene.querySelector(".demo-selected-label");
  const viewport = scene.querySelector(".carousel-demo-viewport");
  if (!track || !cards.length) return;

  const target = cards[3];
  const step = cards[1].offsetLeft - cards[0].offsetLeft;
  const vpW = viewport.clientWidth;
  const centerTarget = target.offsetLeft + target.offsetWidth / 2 - vpW / 2;
  const maxMove = track.scrollWidth - vpW;
  const finalX = -Math.max(0, Math.min(centerTarget, maxMove));

  track.animate([
    { offset:0,   transform:"translateX(0)" },
    { offset:.22, transform:`translateX(${-Math.min(step * 1.1, maxMove)}px)` },
    { offset:.48, transform:`translateX(${-Math.min(step * 2.3, maxMove)}px)` },
    { offset:.68, transform:`translateX(${finalX}px)` },
    { offset:1,   transform:`translateX(${finalX}px)` }
  ], { duration:data.duration, fill:"forwards", easing:"cubic-bezier(.4,0,.2,1)" });

  const cx = viewport.offsetLeft + vpW / 2;
  const cy = viewport.offsetTop + viewport.clientHeight * .52;
  mouse.style.left = cx + "px"; mouse.style.top = cy + "px";
  ring.style.left  = cx + "px"; ring.style.top  = cy + "px";

  mouse.animate([
    { offset:0,   opacity:0, transform:"translate(115px,95px) scale(1.2)" },
    { offset:.65, opacity:0, transform:"translate(115px,95px) scale(1.2)" },
    { offset:.79, opacity:1, transform:"translate(0,0) scale(1)" },
    { offset:.85, opacity:1, transform:"translate(0,0) scale(.82)" },
    { offset:.9,  opacity:1, transform:"translate(0,0) scale(1)" },
    { offset:1,   opacity:1, transform:"translate(0,0) scale(1)" }
  ], { duration:data.duration, fill:"forwards" });

  const clickAt = data.duration * .84;
  scene._carouselTimeout = setTimeout(() => {
    if (!scene.isConnected) return;
    target.classList.add("chosen");
    ring.classList.add("clicked");
    label.classList.add("visible");
    AudioEngine.click();
  }, clickAt);
}

/* ==========================================
   EFEITOS GLOBAIS
========================================== */
const flash = document.getElementById("flash");
const wipe  = document.getElementById("wipe");

function triggerFlash(){
  flash.classList.remove("hit");
  void flash.offsetWidth;
  flash.classList.add("hit");
}

function triggerWipe(){
  wipe.classList.remove("sweep");
  void wipe.offsetWidth;
  wipe.classList.add("sweep");
}

/* ==========================================
   AGENDAMENTO DE SONS POR CENA
========================================== */
const FLASH_SCENES = new Set([0, 4, 9, 14, 19]);

function scheduleSceneSounds(data, index){
  if (!AudioEngine.enabled || AudioEngine.muted) return;

  /* whoosh de transição sempre */
  AudioEngine.whoosh(0.55, 0.3);

  /* impact + sting nas cenas de impacto */
  if (FLASH_SCENES.has(index)){
    setTimeout(() => AudioEngine.impact(), 60);
  }

  /* sting do kicker */
  setTimeout(() => AudioEngine.sting(0, 1.4), 110);

  /* stings das palavras (staggered como as animações) */
  if (data.lines){
    data.lines.forEach((_, i) => {
      setTimeout(() => {
        AudioEngine.sting(0, 1 + i * 0.08);
      }, 150 + i * 220);
    });
  }

  /* chime do ícone */
  if (data.type === "creative" || data.type === "instagram"){
    setTimeout(() => AudioEngine.chime(), 220);
  }

  /* pops dos cards */
  if (data.cards){
    setTimeout(() => AudioEngine.click(), 380);
    setTimeout(() => AudioEngine.click(), 660);
  }

  /* máquina do carrossel */
  if (data.type === "carousel-demo"){
    setTimeout(() => AudioEngine.click(), 500);
  }

  /* drone de mapa + pings sonares */
  if (data.camera === "map" || data.camera === "world-map"){
    AudioEngine.drone(4.5);
    [900, 1350, 1800, 2300, 2900, 3500, 4100].forEach(t => {
      setTimeout(() => AudioEngine.ping(), t);
    });
  }

  /* subida do gráfico */
  if (data.type === "stats-dashboard"){
    AudioEngine.rise(3.6);
    setTimeout(() => AudioEngine.impact(), 3200);
    setTimeout(() => AudioEngine.ping(), 3800);
  }

  /* acorde final */
  if (data.type === "final"){
    setTimeout(() => AudioEngine.chord(), 250);
  }

  /* intro mapa — sting solene */
  if (data.type === "map-intro"){
    setTimeout(() => AudioEngine.sting(0, 0.7), 260);
    setTimeout(() => AudioEngine.sting(0, 0.9), 480);
  }
}

/* ==========================================
   TIMELINE
========================================== */
const timeline = [];
let totalMs = 0;
scenes.forEach((s, i) => {
  timeline.push({ index:i, start:totalMs, end:totalMs + s.duration });
  totalMs += s.duration;
});
const actualDuration = totalMs;

const progress = document.getElementById("progress");
const counter  = document.getElementById("counter");

let currentScene = null;
let currentIndex = -1;
let startTime = 0;
let running = false;
let finished = false;

/* ==========================================
   AJUSTE DE ENCAIXE
========================================== */
function fitSceneToStage(scene){
  if (!scene) return;
  scene.style.setProperty("--fit-scale", "1");
  const sr = stage.getBoundingClientRect();
  const contentW = Math.max(scene.scrollWidth, scene.getBoundingClientRect().width);
  const contentH = Math.max(scene.scrollHeight, scene.getBoundingClientRect().height);
  const safeW = Math.max(1, sr.width  - 28);
  const safeH = Math.max(1, sr.height - 110);
  const fit = Math.min(1, safeW / contentW, safeH / contentH);
  scene.style.setProperty("--fit-scale", String(Math.max(.68, fit)));
}

/* ==========================================
   TROCA DE CENA
========================================== */
function showScene(index){
  if (index === currentIndex) return;

  triggerWipe();

  if (currentScene){
    if (currentScene._carouselTimeout) clearTimeout(currentScene._carouselTimeout);
    currentScene.classList.remove("active");
    currentScene.classList.add("leaving");
  }

  clearCamera();
  currentIndex = index;

  const data = scenes[index];
  currentScene = createScene(data);
  if (data.type === "instagram") currentScene.classList.add("context-instagram");

  requestAnimationFrame(() => {
    currentScene.classList.add("active");
    fitSceneToStage(currentScene);
    requestAnimationFrame(() => {
      fitSceneToStage(currentScene);
      if (data.type !== "stats-dashboard") runCamera(data, currentScene);
      if (data.type === "carousel-demo")  runCarouselDemo(currentScene, data);
    });
  });

  camera.style.filter = (data.camera === "map" || data.camera === "world-map" || data.type === "map-intro")
    ? "saturate(1.08) contrast(1.05)"
    : "none";

  if (FLASH_SCENES.has(index)) triggerFlash();

  /* dispara os sons da cena */
  scheduleSceneSounds(data, index);
}

/* ==========================================
   LOOP
========================================== */
function animate(now){
  if (!running || finished) return;
  const time = Math.min(now - startTime, actualDuration);
  progress.style.width = (time / actualDuration * 100) + "%";

  const seconds = Math.floor(time / 1000);
  const total   = Math.ceil(actualDuration / 1000);
  counter.textContent = "00:" + String(seconds).padStart(2,"0") + " / 00:" + String(total).padStart(2,"0");

  const current = timeline.find(s => time >= s.start && time < s.end);
  if (current) showScene(current.index);

  if (time >= actualDuration){ finishMotion(); return; }
  requestAnimationFrame(animate);
}

/* ==========================================
   FINAL
========================================== */
function finishMotion(){
  if (finished) return;
  finished = true;
  running = false;
  progress.style.width = "100%";
  const total = Math.floor(actualDuration / 1000);
  counter.textContent = "00:" + String(total).padStart(2,"0") + " / 00:" + String(total).padStart(2,"0");
  clearCamera();
  if (currentScene){
    currentScene.classList.remove("leaving");
    currentScene.classList.add("active");
  }
  console.log("MRO CINEMATIC MOTION 5.1 — AURORA CUT + SOUND — FINALIZADO");
}

/* ==========================================
   START
========================================== */
function startMotion(){
  if (running || finished) return;
  running = true;
  startTime = performance.now();
  requestAnimationFrame(animate);
}

/* ==========================================
   GATE / MUTE
========================================== */
const gate    = document.getElementById("gate");
const muteBtn = document.getElementById("muteBtn");

function updateMuteIcon(){
  if (AudioEngine.muted){
    muteBtn.classList.add("muted");
    muteBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;
  } else {
    muteBtn.classList.remove("muted");
    muteBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>`;
  }
}

gate.addEventListener("click", () => {
  AudioEngine.init();
  AudioEngine.resume();
  AudioEngine.enabled = true;
  AudioEngine.whoosh(0.9, 0.4);
  setTimeout(() => AudioEngine.chord(), 250);

  gate.classList.add("hidden");
  setTimeout(startMotion, 350);
}, { once: true });

muteBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  AudioEngine.setMuted(!AudioEngine.muted);
  updateMuteIcon();
});

/* primeiro gesto genérico também destrava o audio (fallback) */
document.addEventListener("pointerdown", () => {
  AudioEngine.init();
  AudioEngine.resume();
}, { once: true });

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (currentScene) fitSceneToStage(currentScene); }, 100);
});

</script>
